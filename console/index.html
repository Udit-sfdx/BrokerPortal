<!DOCTYPE html>
<html lang="en" data-app="console">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Broker Portal · ThinkVibes console</title>
<meta name="description" content="Internal console for ThinkVibes sales and operations. Staff only.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script>/* theme before first paint */try{var t=localStorage.getItem("bp.theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;}catch(e){}</script>
<link rel="stylesheet" href="assets/vendor/slds.min.css">
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root" class="slds-notify_container"></div>
<noscript>Broker Portal needs JavaScript.</noscript>
<script type="module">
// The HTML may be a cached copy. Ask the server which build is live (never cached), then load
// exactly that build's stylesheet and modules. No version.json (unbuilt local copy) = load as is.
let v = '';
try { v = (await (await fetch('version.json', { cache: 'no-store' })).json()).v || ''; } catch { v = ''; }
const q = v ? `?v=${v}` : '';
const css = document.createElement('link');
css.rel = 'stylesheet';
css.href = `assets/bp.css${q}`;
document.head.append(css);
await import(`./js/apps/console.js${q}`);
</script>
</body>
</html>
