const fmtTime = t => { const d = new Date(t); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); };
const fmtDate = t => { if (!t) return '—'; const d = new Date(t); return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); };
const fmtDT = t => t ? fmtDate(t) + ', ' + fmtTime(t) : '—';

const fmtK = n => n >= 1e6 ? (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(Math.round(n));
const fmtDur = ms => {
  const neg = ms < 0; ms = Math.abs(ms);
  const m = Math.floor(ms / MIN), h = Math.floor(m / 60), d = Math.floor(h / 24);
  const s = d ? d + 'd ' + (h % 24) + 'h' : h ? h + 'h ' + (m % 60) + 'm' : m + 'm';

};

function buildPayments(deal) {
  const p = projectByName(deal.project);
  const plan = p ? p.plan : [['Deposit',10],['Balance',90]];
  let due = deal.createdAt + 7 * DAY;
  deal.payments = plan.map(([label, pct], i) => {
    const row = {label, pct, amount:deal.price * pct / 100, due, status:'Upcoming', paidAt:null};
    due += (i === 0 ? 30 : 120) * DAY;
    return row;
  });
}

const me = () => S.users[S.persona];
const isAgent = () => me().role === 'Agent';
const canSeeAll = () => !isAgent();
const agents = () => Object.values(S.users).filter(u => u.role === 'Agent');
const userName = id => id && S.users[id] ? S.users[id].name : 'Unassigned queue';
const campaignById = id => S.campaigns.find(c => c.id === id);
const leadById = id => S.leads.find(l => l.id === id);
const dealById = id => S.deals.find(d => d.id === id);
const visibleLeads = () => S.leads.filter(l => canSeeAll() || l.ownerId === S.persona);
const visibleDeals = () => S.deals.filter(d => canSeeAll() || d.ownerId === S.persona);
const openLoad = id => S.leads.filter(l => l.ownerId === id && OPEN.includes(l.status)).length;
const stagesOf = type => S.cfg.stages[type] || [];
const stageOf = d => stagesOf(d.type)[d.stageIdx];
const nextActiveIdx = d => { const st = stagesOf(d.type); for (let i = d.stageIdx + 1; i < st.length; i++) if (st[i].active) return i; return -1; };
const commissionTriggerIdx = type => stagesOf(type).findIndex(s => s.commission);
const paidPct = d => d.payments.filter(p => p.status === 'Paid').reduce((a, p) => a + p.pct, 0);
const KYC_DOCS = ['Passport','Emirates ID / visa','Source of funds declaration'];
const kycComplete = d => KYC_DOCS.every(k => d.kyc.docs[k]) && d.kyc.screening === 'Clear' && !!d.kyc.risk;

function leadScore(l) {
  let s = 35;
  if (l.budget >= 2000000) s += 15; else if (l.budget >= 1000000) s += 8;
  if (l.qual.finance === 'Cash') s += 15; else if (l.qual.finance === 'Mortgage – pre-approved') s += 10;
  if (l.qual.timeline === '0–3 months') s += 15; else if (l.qual.timeline === '3–6 months') s += 7;
  if (l.qual.purpose) s += 5;
  if (l.firstResponseAt) s += 5;
  if (l.attributions.length > 1) s += 8;
  if (l.qual.otherBroker === 'Yes') s -= 15;
  if (l.status === 'Lost') s = Math.min(s, 10);
  return Math.max(0, Math.min(100, s));
}

function commissionCalc(d) {
  const rates = S.cfg.commissionRates;
  const rate = rates.find(r => r.dealType === d.type && r.project === d.project) || rates.find(r => r.dealType === d.type && r.project === 'Any') || {rate:0, payer:'—', id:null};
  const gross = d.price * rate.rate / 100;
  const vat = gross * S.cfg.vat / 100;
  const coBroker = d.coBroker ? gross * d.coBroker.split / 100 : 0;
  const firmNet = gross - coBroker;
  const sp = S.cfg.splits;
  const lead = leadById(d.leadId);
  const referral = lead && lead.channel === 'Referral' ? firmNet * sp.referral / 100 : 0;
  const agent = firmNet * sp.agent / 100, tl = firmNet * sp.teamLeader / 100;
  return {rate:rate.rate, payer:rate.payer, rateId:rate.id, gross, vat, invoice:gross + vat, coBroker, firmNet, agent, tl, referral, retained:firmNet - agent - tl - referral};
}

/* ---------- engines: routing, capture, SLA, telemarketing ---------- */
function routeLead(lead, exclude = []) {
  const trace = [];
  let pool = agents().filter(a => a.active && !exclude.includes(a.id));
  const fns = {
    licence: a => ({ok:a.brnExpiry > S.now, why:(a.brnExpiry > S.now ? 'BRN ' + a.brn + ' valid to ' : 'BRN ' + a.brn + ' expired ') + fmtDate(a.brnExpiry)}),
    lob: a => ({ok:a.lob.includes(lead.lob), why:a.lob.join(', ')}),
    lang: a => ({ok:a.langs.includes(lead.lang), why:a.langs.join(', ')}),
  };
  if (exclude.length) trace.push({rule:'Re-assignment', note:'Excluded previous owner: ' + exclude.map(userName).join(', '), rows:[]});
  for (const rule of S.cfg.routing) {
    if (rule.order) continue;
    if (!rule.on) { trace.push({rule:rule.label, note:'Switched off in Setup – not applied', rows:[]}); continue; }
    const rows = pool.map(a => ({agent:a.name, ...fns[rule.id](a)}));
    const passed = pool.filter((a, i) => rows[i].ok);
    if (!passed.length && !rule.hard && rule.id === 'lang' && pool.length) { trace.push({rule:rule.label, note:'No agent speaks ' + lead.lang + ' – rule relaxed', rows}); continue; }
    trace.push({rule:rule.label, note:passed.length + ' of ' + pool.length + ' passed', rows});
    pool = passed;
    if (!pool.length) break;
  }
  if (!pool.length) { trace.push({rule:'Result', note:'No eligible agent – lead placed in the unassigned queue', rows:[]}); return {owner:null, trace}; }
  const orderRules = S.cfg.routing.filter(r => r.order && r.on);
  pool.sort((a, b) => { for (const r of orderRules) { const c = r.id === 'workload' ? openLoad(a.id) - openLoad(b.id) : (a.lastAssigned || 0) - (b.lastAssigned || 0); if (c) return c; } return 0; });
  if (orderRules.length) trace.push({rule:orderRules.map(r => r.label).join(' → '), note:pool.map(a => `${a.name} (${openLoad(a.id)} open)`).join(' · '), rows:[]});
  trace.push({rule:'Result', note:'Assigned to ' + pool[0].name, rows:[]});
  return {owner:pool[0], trace};
}

function assignLead(lead, owner, trace, reason) {
  lead.ownerId = owner ? owner.id : null;
  lead.assignedAt = S.now;
  lead.slaDueAt = S.now + S.cfg.sla.firstResponseMin * MIN;
  lead.escalated = false;
  lead.routingTrace = trace;
  if (owner) {
    owner.lastAssigned = S.now;
    activity(lead, 'assign', `${reason || 'Routed'} to ${owner.name}. First-response SLA: ${S.cfg.sla.firstResponseMin} min (due ${fmtTime(lead.slaDueAt)}).`, 'Routing engine');
    notify(owner.id, `New lead assigned: ${lead.name} (${lead.channel})`, {view:'lead', id:lead.id});
  } else {
    activity(lead, 'assign', 'No eligible agent. Placed in the unassigned queue.', 'Routing engine');
    notify('u_rania', `Lead in unassigned queue: ${lead.name}`, {view:'lead', id:lead.id});
  }
}

function captureLead(inp) {
  const errors = [];
  if (!inp.name || !inp.name.trim()) errors.push('Name is required.');
  if (!validPhone(inp.phone)) errors.push('Phone must be a valid international number (9–15 digits).');
  if (!validEmail(inp.email)) errors.push('Email format is invalid.');
  if (!LOBS.includes(inp.lob)) errors.push('Line of business is required.');
  if (!inp.channel) errors.push('Source channel must be declared.');
  if (errors.length) return {ok:false, errors};
  const phoneN = normPhone(inp.phone);
  const email = (inp.email || '').trim().toLowerCase();
  const camp = inp.campaignId ? campaignById(inp.campaignId) : null;
  const attribution = {campaignId:camp ? camp.id : null, channel:inp.channel, creative:inp.creative || '', at:S.now};
  const existing = S.leads.find(l => l.phoneN === phoneN || (email && l.email && l.email.toLowerCase() === email));
  if (existing) {
    existing.attributions.push(attribution);
    activity(existing, 'merge', `Repeat enquiry via ${inp.channel}${camp ? ' · ' + camp.name : ''}. Matched on ${existing.phoneN === phoneN ? 'phone' : 'email'} – merged into this lead, no duplicate created.`, 'Dedupe');
    if (['Lost','Nurture'].includes(existing.status)) {
      existing.status = 'New'; existing.firstResponseAt = null; existing.slaDueAt = S.now + S.cfg.sla.firstResponseMin * MIN; existing.escalated = false;
      activity(existing, 'status', 'Re-engaged: status reset to New, SLA restarted.', 'Dedupe');
    }
    if (existing.ownerId) notify(existing.ownerId, `Repeat enquiry from your lead ${existing.name} (${inp.channel})`, {view:'lead', id:existing.id});
    return {ok:true, lead:existing, merged:true};
  }
  const lead = mkLead({name:inp.name.trim(), phone:inp.phone, phoneN, email:inp.email || '', lang:inp.lang || 'English', lob:inp.lob, project:inp.project || '',
    budget:Number(inp.budget) || 0, channel:inp.channel, campaignId:attribution.campaignId, creative:attribution.creative, consent:inp.consent !== false});
  lead.attributions.push(attribution);
  activity(lead, 'system', `Captured from ${inp.channel}${camp ? ' · ' + camp.name : ''}${attribution.creative ? ' · creative “' + attribution.creative + '”' : ''}`, 'System');
  activity(lead, 'system', 'Dedupe: no existing lead in this firm with the same phone or email.', 'Dedupe');
  lead.dnc = DNC_REGISTRY.includes(phoneN);
  activity(lead, lead.dnc ? 'block' : 'system',
    lead.dnc ? 'Compliance: number is on the Do Not Call registry. Calls are blocked; messaging only with recorded consent.' :
    `Compliance: not on DNC registry · consent ${lead.consent ? 'recorded (' + inp.channel + ' form)' : 'missing'}.`, 'Compliance');
  S.leads.unshift(lead);
  const {owner, trace} = routeLead(lead);
  assignLead(lead, owner, trace, 'Routed');
  return {ok:true, lead, merged:false};
}

  }
  const res = captureLead(data);
  if (!res.ok) { toast('error', 'Capture failed', res.errors.join(' ')); return; }
  if (res.merged) toast('info', 'Repeat enquiry merged', `${esc(res.lead.name)}: new attribution added, no duplicate created.`);
  else if (res.lead.ownerId) toast('success', 'Lead captured and routed', `${esc(res.lead.name)} → ${esc(userName(res.lead.ownerId))}`);
  else toast('warning', 'Lead sent to the unassigned queue', `${esc(res.lead.name)}: no eligible agent.`);
  go('lead', res.lead.id);
}

function firstResponse(lead) {
  if (!lead.firstResponseAt) {
    lead.firstResponseAt = S.now;
    const ms = S.now - lead.assignedAt;
    activity(lead, 'system', `First response in ${fmtDur(ms)} (SLA ${S.cfg.sla.firstResponseMin} min) – ${ms <= S.cfg.sla.firstResponseMin * MIN ? 'met' : 'missed'}.`, 'SLA monitor');
  }
}

function slaEngine() {
  let changed = false;
  for (const l of S.leads) {
    if (l.status !== 'New' || !l.ownerId || l.firstResponseAt || !l.slaDueAt) continue;
    if (!l.escalated && S.now > l.slaDueAt) {
      l.escalated = true; l.breached = true;
      activity(l, 'escalate', `First-response SLA breached (${S.cfg.sla.firstResponseMin} min). Escalated to Rania Aziz (Team Leader).`, 'SLA monitor');
      notify('u_rania', `SLA breached: ${l.name} (owner ${userName(l.ownerId)})`, {view:'lead', id:l.id});
      notify(l.ownerId, `SLA breached on ${l.name} – respond now or it will be re-assigned`, {view:'lead', id:l.id});
      toast('warning', 'SLA breached – escalated', `${esc(l.name)} · owner ${esc(userName(l.ownerId))} · Team Leader notified`);
      changed = true;
    } else if (l.escalated && S.now > l.slaDueAt + S.cfg.sla.reassignAfterMin * MIN) {
      const prev = l.ownerId;
      const {owner, trace} = routeLead(l, [prev]);
      l.reassignCount++;
      activity(l, 'escalate', `No response ${S.cfg.sla.reassignAfterMin} min after breach. Removed from ${userName(prev)}.`, 'SLA monitor');
      notify(prev, `Lead re-assigned away from you: ${l.name}`, {view:'lead', id:l.id});
      assignLead(l, owner, trace, 'Re-assigned');
      toast('error', 'Lead re-assigned', `${esc(l.name)}: ${esc(userName(prev))} → ${esc(userName(l.ownerId))}`);
      if (S.slowAfter === l.id) { S.speed = 1; S.slowAfter = null; setTimeout(() => toast('info', 'Clock back to real time', 'Step 4 complete.'), 600); }
      changed = true;
    }
  }
  return changed;
}

function callBlocks(lead) {
  const h = new Date(S.now).getUTCHours(), {start, end} = S.cfg.callWindow, b = [];
  if (h < start || h >= end) b.push(`Outside the permitted calling window (${pad(start)}:00–${pad(end)}:00 GST). It is ${fmtTime(S.now)}.`);
  if (lead.dnc) b.push('The number is on the Do Not Call registry.');
  if (lead.refusalDate && sameDay(lead.refusalDate, S.now)) b.push('The client refused a call today. No repeat call the same day.');
  return b;
}

/* ---------- deals ---------- */
function gateCheck(d) {
  const st = stageOf(d), problems = [];
  const missing = st.docs.filter(doc => !d.docs[doc]);
  if (missing.length) problems.push('Missing documents: ' + missing.join(', '));
  if (st.kyc && !kycComplete(d)) problems.push('KYC is incomplete (passport, Emirates ID/visa, source of funds, sanctions screening and risk rating)');
  const ni = nextActiveIdx(d);
  if (ni < 0) return {ok:false, problems:['This is the final stage.'], next:-1};
  const nst = stagesOf(d.type)[ni];
  const proj = projectByName(d.project);
  if (nst.commission && d.type === 'Off-plan' && proj && paidPct(d) < proj.threshold) problems.push(`Developer commission threshold not met: ${paidPct(d)}% paid of ${proj.threshold}% required`);
  if (ni === stagesOf(d.type).length - 1 && d.commission.status < 3) problems.push('Record the commission as received (Commission tab) before closing the deal');
  return {ok:!problems.length, problems, next:ni};
}
function advanceDeal(d, toIdx) {
  if (d.lost) { toast('error', 'Deal is closed', 'Lost deals can’t move.'); return false; }
  const g = gateCheck(d);
  if (toIdx != null && toIdx !== g.next) {
    if (toIdx < d.stageIdx) { d.stageIdx = toIdx; d.stageEnteredAt = S.now; activity(d, 'status', 'Stage moved back to ' + stageOf(d).name, me().name); toast('info', 'Stage moved back', stageOf(d).name); return true; }
    toast('error', 'Stages can’t be skipped', 'Advance one stage at a time so every gate is checked.'); return false;
  }
  if (!g.ok) {
    activity(d, 'block', 'Stage advance blocked: ' + g.problems.join('; '), 'Stage gate');
    toast('error', `Can’t leave “${stageOf(d).name}”`, g.problems.map(esc).join('<br>'));
    return false;
  }
  const from = stageOf(d).name;
  d.stageIdx = g.next; d.stageEnteredAt = S.now;
  activity(d, 'status', `Stage moved: ${from} → ${stageOf(d).name}`, me().name);
  toast('success', 'Stage advanced', `${esc(d.name)} is now in ${esc(stageOf(d).name)}`);
  return true;
}

/* ---------- toast & modal ---------- */
function toast(kind, title, html) {
  const icon = {success:'success', warning:'warning', error:'error', info:'info'}[kind];
  const el = document.createElement('div');
  el.className = `slds-notify slds-notify_toast slds-theme_${kind}`;
  el.setAttribute('role', 'status');
  el.innerHTML = `<span class="slds-icon_container slds-m-right_small slds-no-flex slds-align-top">${uIcon(icon, 'slds-icon_small' + (kind === 'warning' ? ' slds-icon-text-default' : ''))}</span>
    <div class="slds-notify__content"><h2 class="slds-text-heading_small">${esc(title)}</h2>${html ? `<p class="slds-m-top_xx-small">${html}</p>` : ''}</div>
    <div class="slds-notify__close"><button class="slds-button slds-button_icon ${kind === 'warning' ? '' : 'slds-button_icon-inverse'}" title="Close" data-act="closeToast">${bIconOnly('close')}</button></div>`;
  $('#toast-root').appendChild(el);
  while ($('#toast-root').children.length > 3) $('#toast-root').firstChild.remove();
  setTimeout(() => el.remove(), 5500);
}
function openModal(title, body, footer, size) {

}

function tabs(list, active, act) {

function timeline(acts) {

  const ic = {call:'call', chat:'chat', email:'email', assign:'assignment', escalate:'warning', merge:'merge', status:'check', system:'settings', block:'ban', doc:'file', money:'moneybag'};
  return `<ul class="bp-tl">${acts.map(a => `<li><span class="bp-tl-ico ico-${a.type}"><svg aria-hidden="true"><use href="#u-${ic[a.type] || 'info'}"></use></svg></span><div><div>${esc(a.text)}</div><div class="bp-muted">${esc(a.by)} · ${fmtDT(a.at)}</div></div></li>`).join('')}</ul>`;
}
function slaBadge(l) {
  if (!['New'].includes(l.status) || !l.ownerId || !l.slaDueAt) return l.firstResponseAt ? `<span class="bp-sla done">Responded in ${fmtDur(l.firstResponseAt - (l.assignedAt || l.createdAt))}</span>` : '';
  if (l.firstResponseAt) return `<span class="bp-sla done">Responded in ${fmtDur(l.firstResponseAt - l.assignedAt)}</span>`;
  const left = l.slaDueAt - S.now;
  const cls = left < 0 ? 'bad' : left < 5 * MIN ? 'soon' : 'ok';
  return `<span class="bp-sla ${cls}" data-sla="${l.id}">${left < 0 ? 'SLA overdue ' + fmtDur(-left) : 'SLA ' + fmtDur(left) + ' left'}</span>`;
}

function viewLeads() {
  const f = S.leadFilter;
  let rows = visibleLeads();
  if (f === 'mine') rows = rows.filter(l => l.ownerId === S.persona && OPEN.includes(l.status));
  if (f === 'open') rows = rows.filter(l => OPEN.includes(l.status));
  if (f === 'queue') rows = S.leads.filter(l => !l.ownerId);
  if (f === 'breached') rows = rows.filter(l => l.breached && OPEN.includes(l.status));
  const filters = [['mine', 'My open leads'], ...(canSeeAll() ? [['open', 'All open leads'], ['queue', 'Unassigned queue'], ['breached', 'SLA breached']] : []), ['all', canSeeAll() ? 'All leads' : 'All my leads']];
  const simMenu = Object.entries(SIMS).map(([k, s]) => `<button class="slds-button slds-button_neutral slds-m-right_xx-small slds-m-bottom_xx-small" data-act="sim" data-id="${k}">${bIcon('download')}${esc(s.label)}</button>`).join('');
  return pageHeader('lead', 'Leads', esc(filters.find(x => x[0] === f) ? filters.find(x => x[0] === f)[1] : 'Leads'),
      `<button class="slds-button slds-button_neutral" data-act="newLead">${bIcon('add')}New lead</button><button class="slds-button slds-button_neutral" data-act="importCsv">${bIcon('upload')}Import CSV</button>`,
      `<div class="slds-m-bottom_x-small">${filters.map(([id, l]) => `<button class="slds-button ${f === id ? 'slds-button_brand' : 'slds-button_neutral'} slds-m-right_xx-small" data-act="leadFilter" data-id="${id}">${l}</button>`).join('')}</div>
       <div class="bp-small bp-muted slds-m-bottom_xx-small">Simulate inbound leads (stand-ins for portal, Meta and web integrations):</div>${simMenu}`)
    + `<div class="slds-card bp-table-wrap"><table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped bp-small"><thead><tr class="slds-line-height_reset"><th>Name</th><th>Status</th><th>Source</th><th>Campaign</th><th>Line</th><th>Language</th><th>Owner</th><th>Created</th><th>SLA / last activity</th><th>Score</th></tr></thead><tbody>
      ${rows.length ? rows.map(l => `<tr class="${S.highlight === l.id ? 'bp-highlight' : ''}"><td><a class="bp-link" data-act="open" data-view="lead" data-id="${l.id}">${esc(l.name)}</a>${l.attributions.length > 1 ? ' ' + badge('×' + l.attributions.length + ' enquiries') : ''}${l.dnc ? ' ' + badge('DNC', 'slds-theme_error') : ''}</td><td>${statusBadge(l.status)}</td><td>${esc(l.channel)}</td><td>${l.campaignId ? esc(campaignById(l.campaignId).name) : '<span class="bp-muted">—</span>'}</td><td>${esc(l.lob)}</td><td>${esc(l.lang)}</td><td>${l.ownerId ? esc(userName(l.ownerId)) : badge('Queue', 'slds-theme_warning')}</td><td>${fmtDate(l.createdAt)}</td><td>${l.status === 'New' && l.ownerId ? slaBadge(l) : '<span class="bp-muted">' + ago(l.lastActivityAt || l.createdAt) + '</span>'}</td><td>${leadScore(l)}</td></tr>`).join('') : `<tr><td colspan="10"><div class="bp-empty">No leads in this view.</div></td></tr>`}
    </tbody></table></div>`;
}

  const camp = l.campaignId ? campaignById(l.campaignId) : null;
  const closed = ['Converted', 'Lost'].includes(l.status);
  const pIdx = l.status === 'Lost' ? Math.max(0, LEAD_PATH.indexOf('Contacted')) : l.status === 'Nurture' ? 2 : LEAD_PATH.indexOf(l.status);
  const q = l.qual;
  const qSel = (key, label, opts) => fSelect('q-' + key, label, ['', ...opts], q[key], true, `data-bind="qual" data-key="${key}" ${closed ? 'disabled' : ''}`);
  const actions = `<div class="slds-button-group" role="group">
      <button class="slds-button slds-button_neutral" data-act="call" ${closed ? 'disabled' : ''}>${bIcon('call')}Call</button>
      <button class="slds-button slds-button_neutral" data-act="message" ${closed ? 'disabled' : ''}>${bIcon('chat')}WhatsApp / email</button>
      <button class="slds-button slds-button_neutral" data-act="nurture" ${closed || l.status === 'Nurture' ? 'disabled' : ''}>Nurture</button>
      <button class="slds-button slds-button_neutral" data-act="markLost" ${closed ? 'disabled' : ''}>Mark lost</button>

        ['Budget', l.budget ? fmtAED(l.budget) : '—'], ['First response', slaBadge(l) || '—'], ['Lead score', `<b>${leadScore(l)}</b> <span class="bp-muted">(rules now, AI later)</span>`]]))
    + path(LEAD_PATH, pIdx === -1 ? 0 : pIdx, l.status === 'Lost')
    + (l.status === 'Lost' ? `<div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small"><h2>Lost – ${esc(l.lostReason)}</h2></div>` : '')
    + (deal ? `<div class="slds-notify slds-notify_alert slds-alert_offline slds-m-bottom_small" style="background:#2e844a"><h2>Converted to deal <a class="bp-link" style="color:#fff;text-decoration:underline" data-act="open" data-view="deal" data-id="${deal.id}">${esc(deal.name)}</a> · Contact ${esc(deal.contactId)} + Individual Account ${esc(deal.accountId)}</h2></div>` : '')
    + `<div class="bp-grid bp-cols-2"><div>
      ${card('Qualification', `<div class="slds-grid slds-wrap slds-gutters_x-small">
          <div class="slds-col slds-size_1-of-2">${qSel('finance', 'Finance', ['Cash', 'Mortgage – pre-approved', 'Mortgage – not yet'])}</div>
          <div class="slds-col slds-size_1-of-2">${fInput('q-budget', 'Budget (AED)', l.budget || '', 'number', true, `data-bind="budget" ${closed ? 'disabled' : ''}`)}</div>
          <div class="slds-col slds-size_1-of-2">${fInput('q-area', 'Area / project', q.area, 'text', true, `data-bind="qual" data-key="area" ${closed ? 'disabled' : ''}`)}</div>
          <div class="slds-col slds-size_1-of-2">${qSel('unitType', 'Unit type', ['Studio', '1BR', '2BR', '3BR', '4BR+', 'Villa', 'Townhouse', 'Office', 'Retail'])}</div>
          <div class="slds-col slds-size_1-of-2">${qSel('residency', 'Residency', ['Resident', 'Non-resident'])}</div>
          <div class="slds-col slds-size_1-of-2">${qSel('purpose', 'Purpose', ['Live', 'Invest', 'Rent out'])}</div>
          <div class="slds-col slds-size_1-of-2">${qSel('timeline', 'Timeline', ['0–3 months', '3–6 months', '6–12 months', '12+ months'])}</div>
          <div class="slds-col slds-size_1-of-2">${qSel('otherBroker', 'Another broker involved?', ['No', 'Yes'])}</div>
        </div>`, closed ? '' : `<button class="slds-button slds-button_brand" data-act="qualify" ${l.status === 'Qualified' ? 'disabled' : ''}>${l.status === 'Qualified' ? 'Qualified' : 'Mark as qualified'}</button>`, 'contact')}
      ${card('Activity timeline', timeline(l.activities), '', 'log_a_call')}
    </div><div>
      ${card('Campaign attribution', l.attributions.map((a, i) => `<div class="slds-p-vertical_x-small bp-small" style="border-bottom:1px solid #f3f3f3"><b>${i === 0 ? 'Original source' : 'Repeat enquiry ' + i}</b> · ${fmtDT(a.at)}<br>${esc(a.channel)}${a.campaignId ? ` · <a class="bp-link" data-act="open" data-view="campaign" data-id="${a.campaignId}">${esc(campaignById(a.campaignId).name)}</a>` : ''}${a.creative ? `<br><span class="bp-muted">Creative: ${esc(a.creative)}</span>` : ''}</div>`).join('') + `<p class="bp-small bp-muted slds-m-top_x-small">The original campaign stays linked through to commission received.</p>`, '', 'campaign')}
      ${card('Routing decision', l.routingTrace.length ? traceTable(l.routingTrace) : '<div class="bp-empty">Seed record – routed before the demo started.</div>', '', 'assignment')}
      ${card('Compliance', `<dl class="bp-kv"><dt>DNC registry</dt><dd>${l.dnc ? badge('Listed – calls blocked', 'slds-theme_error') : badge('Not listed', 'slds-theme_success')}</dd><dt>Consent</dt><dd>${l.consent ? 'Recorded at capture (' + esc(l.channel) + ')' : badge('Missing', 'slds-theme_warning')}</dd><dt>Call window</dt><dd>${pad(S.cfg.callWindow.start)}:00–${pad(S.cfg.callWindow.end)}:00 GST · now ${fmtTime(S.now)} ${callBlocks({}).length ? badge('Closed', 'slds-theme_error') : badge('Open', 'slds-theme_success')}</dd><dt>Refused today</dt><dd>${l.refusalDate && sameDay(l.refusalDate, S.now) ? badge('Yes – no repeat call today', 'slds-theme_warning') : 'No'}</dd></dl>`, '', 'disclosure_and_compliance')}
      ${card('Contact', `<dl class="bp-kv"><dt>Phone</dt><dd>${esc(l.phone)} <span class="bp-muted">(${esc(l.phoneN)})</span></dd><dt>Email</dt><dd>${esc(l.email) || '—'}</dd><dt>Project</dt><dd>${esc(l.project) || '—'}</dd><dt>Created</dt><dd>${fmtDT(l.createdAt)}</dd></dl>`, '', 'contact')}

function traceTable(trace) {
  return trace.map(t => `<div class="slds-m-bottom_x-small"><div class="bp-small"><b>${esc(t.rule)}</b> — ${esc(t.note)}</div>${t.rows && t.rows.length ? `<table class="slds-table slds-table_bordered bp-trace slds-m-top_xx-small"><tbody>${t.rows.map(r => `<tr><td>${esc(r.agent)}</td><td class="${r.ok ? 'bp-pass' : 'bp-fail'}">${r.ok ? '✓' : '✗'}</td><td class="bp-muted">${esc(r.why)}</td></tr>`).join('')}</tbody></table>` : ''}</div>`).join('');
}

/* ---------- views: deals board ---------- */
function viewDeals() {
  const t = S.dealType;
  const typeTabs = tabs([['Off-plan', 'Off-plan'], ['Secondary', 'Secondary sale'], ['Rental', 'Rental (Phase 5)'], ['Commercial', 'Commercial (Phase 5)']], t, 'dealType');
  if (!S.cfg.stages[t]) return pageHeader('opportunity', 'Deals', 'Pipeline board') + `<div class="slds-card slds-p-around_medium">${typeTabs}<div class="bp-empty">${esc(t)} pipelines arrive in Phase 5 (rentals, renewals, vacant inventory mandates, commercial).</div></div>`;
  const deals = visibleDeals().filter(d => d.type === t && !d.lost);
  const st = stagesOf(t);
  const cols = st.map((s, i) => ({s, i})).filter(x => x.s.active);
  const total = deals.filter(d => d.stageIdx < st.length - 1).reduce((a, d) => a + d.price, 0);
  return pageHeader('opportunity', 'Deals', 'Pipeline board', '', detailsRow([['Open deals', String(deals.filter(d => d.stageIdx < st.length - 1).length)], ['Open value', fmtAED(total)], ['Visibility', isAgent() ? 'My deals only' : 'All team deals'], ['How to use', 'Drag a card to the next stage. Gates check documents, KYC and commission rules.']]))
    + `<div class="slds-card slds-p-around_small">${typeTabs}<div class="bp-kanban slds-m-top_small">${cols.map(({s, i}) => {
      const inCol = deals.filter(d => d.stageIdx === i);
      return `<div class="bp-col" data-drop="${i}"><div class="bp-col-head"><span>${esc(s.name)}</span><small>${inCol.length}${s.slaDays ? ' · ' + s.slaDays + 'd' : ''}</small></div>${inCol.map(d => {
        const stuck = s.slaDays && S.now - d.stageEnteredAt > s.slaDays * DAY;
        const g = gateCheck(d);
        return `<div class="bp-card ${stuck ? 'bp-stuck' : ''} ${S.highlight === d.id ? 'bp-highlight' : ''}" draggable="true" data-drag="${d.id}" data-act="open" data-view="deal" data-id="${d.id}"><b>${esc(d.name)}</b>${fmtAED(d.price)}<div class="bp-muted">${esc(userName(d.ownerId))} · ${fmtDur(S.now - d.stageEnteredAt)} in stage</div><div class="slds-m-top_xx-small">${stuck ? badge('Stuck', 'slds-theme_error') + ' ' : ''}${!g.ok && i < st.length - 1 ? badge('Gate: ' + (g.problems[0].startsWith('Missing') ? 'docs' : g.problems[0].startsWith('KYC') ? 'KYC' : 'rule'), 'slds-theme_warning') : ''}${d.coBroker ? ' ' + badge('Co-broke') : ''}</div></div>`;
      }).join('')}</div>`;
    }).join('')}</div></div>`;
}

/* ---------- views: deal record ---------- */
function viewDeal() {
  const d = dealById(S.recId);
  if (!d) return '<div class="bp-empty">Deal not found.</div>';
  if (isAgent() && d.ownerId !== S.persona) return card('No access', '<div class="bp-empty">Agents only see their own deals.</div>');
  const st = stagesOf(d.type);
  const act = st.map((s, i) => ({s, i})).filter(x => x.s.active);
  const cur = act.findIndex(x => x.i === d.stageIdx);
  const g = gateCheck(d);
  const cc = commissionCalc(d);
  const camp = d.campaignId ? campaignById(d.campaignId) : null;
  const tab = S.tab || 'gate';
  const stage = stageOf(d);
  const stuck = stage.slaDays && S.now - d.stageEnteredAt > stage.slaDays * DAY;
  const header = pageHeader('opportunity', `Deal · ${d.type} · ${d.id}`, esc(d.name) + (d.lost ? ' ' + badge('Lost', 'slds-theme_error') : ''),
    d.lost ? '' : `<button class="slds-button slds-button_neutral" data-act="dealLost">Mark lost</button><button class="slds-button slds-button_brand" data-act="advance" ${g.next < 0 ? 'disabled' : ''}>${bIcon('forward')}${g.next < 0 ? 'Closed' : 'Advance to ' + esc(st[g.next].name)}</button>`,
    detailsRow([['Client', esc(d.clientName)], ['Owner', esc(userName(d.ownerId))], ['Property', esc(d.project) + (d.unit ? ' · ' + esc(d.unit) : '')], ['Price', fmtAED(d.price)],
      ['Stage', esc(stage.name) + ' ' + (stuck ? badge('Stuck ' + fmtDur(S.now - d.stageEnteredAt), 'slds-theme_error') : `<span class="bp-muted">${fmtDur(S.now - d.stageEnteredAt)}${stage.slaDays ? ' / ' + stage.slaDays + 'd limit' : ''}</span>`)],
      ['Campaign', camp ? `<a class="bp-link" data-act="open" data-view="campaign" data-id="${camp.id}">${esc(camp.name)}</a>` : esc(d.channel)], ['Commission', fmtAED(cc.gross) + ' · ' + COMMISSION_FLOW[d.commission.status]]]));
  const gateBox = g.next < 0 ? '' : `<div class="slds-notify slds-notify_alert ${g.ok ? '' : 'slds-alert_warning'} slds-m-bottom_small" style="${g.ok ? 'background:#2e844a' : ''}"><h2>${g.ok ? `Ready to advance to “${esc(st[g.next].name)}”` : 'Gate to leave “' + esc(stage.name) + '”: ' + g.problems.map(esc).join(' · ')}</h2></div>`;
  let body = '';
  if (tab === 'gate') body = dealDocsTab(d);
  if (tab === 'payments') body = dealPaymentsTab(d);
  if (tab === 'handover') body = dealHandoverTab(d);
  if (tab === 'commission') body = dealCommissionTab(d, cc);
  if (tab === 'activity') body = timeline(d.activities);
  return header + path(act.map(x => x.s.name), cur, !!d.lost) + gateBox
    + `<div class="slds-card slds-p-around_small">${tabs([['gate', 'Documents &amp; KYC'], ['payments', 'Payment plan'], ['handover', 'Handover checklist'], ['commission', 'Commission'], ['activity', 'Activity']], tab, 'dealTab')}<div class="slds-p-top_small">${body}</div></div>`;
}
function dealDocsTab(d) {

      ${fSelect('kyc-risk', 'Risk rating', ['', 'Low', 'Medium', 'High'], k.risk, true, 'data-act="kycField" data-key="risk"')}
      <div class="slds-form-element"><div class="slds-checkbox"><input type="checkbox" id="kyc-cash" ${k.cash55k ? 'checked' : ''} data-act="kycCash"><label class="slds-checkbox__label" for="kyc-cash"><span class="slds-checkbox_faux"></span><span class="slds-form-element__label">Cash ≥ AED 55,000 or virtual-asset funding</span></label></div></div>
      ${k.cash55k ? `<div class="slds-notify slds-notify_alert slds-alert_warning slds-m-top_x-small"><h2>REAR report required – goAML task created for the AML officer</h2></div>` : ''}

function dealCommissionTab(d, cc) {

  const trig = commissionTriggerIdx(d.type);
  const canClaim = d.stageIdx >= trig;
  const ageing = d.commission.claimedAt && s < 3 ? S.now - d.commission.claimedAt : 0;
  const line = (k, v, strong) => `<tr><td>${k}</td><td class="slds-text-align_right">${strong ? '<b>' + v + '</b>' : v}</td></tr>`;
  return `${path(COMMISSION_FLOW, s, false)}
    <div class="bp-grid bp-cols-2"><div>${card('Calculation', `<table class="slds-table slds-table_bordered bp-small"><tbody>
      ${line('Property price', fmtAED(d.price))}
      ${line(`Commission rate (${esc(cc.payer)} pays)`, cc.rate + '%' + (cc.rateId ? '' : ' <span class="bp-fail">no rate configured</span>'))}
      ${line('Gross commission', fmtAED(cc.gross), true)}
      ${line(`VAT ${S.cfg.vat}% (on invoice)`, fmtAED(cc.vat))}
      ${line('Invoice total', fmtAED(cc.invoice))}
      ${d.coBroker ? line(`Co-broker share – ${esc(d.coBroker.firm)} (${d.coBroker.split}%)`, '− ' + fmtAED(cc.coBroker)) : ''}
      ${line('Firm net commission', fmtAED(cc.firmNet), true)}
      ${line(`Agent – ${esc(userName(d.ownerId))} (${S.cfg.splits.agent}%)`, fmtAED(cc.agent))}
      ${line(`Team leader (${S.cfg.splits.teamLeader}%)`, fmtAED(cc.tl))}
      ${cc.referral ? line(`Referral (${S.cfg.splits.referral}%)`, fmtAED(cc.referral)) : ''}
      ${line('Retained by firm', fmtAED(cc.retained), true)}
    </tbody></table><p class="bp-small bp-muted slds-m-top_x-small">Rates and splits are configurable per developer, project and deal type (Setup → Commission).</p>`, '', 'currency')}</div>
    <div>${card('Collections', `<dl class="bp-kv"><dt>Status</dt><dd>${badge(COMMISSION_FLOW[s], s >= 3 ? 'slds-theme_success' : '')}</dd><dt>Earned when</dt><dd>Deal reaches “${esc(stagesOf(d.type)[trig].name)}”${canClaim ? ' ✓' : ''}</dd><dt>Claimed</dt><dd>${fmtDate(d.commission.claimedAt)}</dd><dt>Invoice</dt><dd>${esc(d.commission.invoiceNo) || '—'}</dd><dt>Received</dt><dd>${fmtDate(d.commission.receivedAt)}</dd><dt>Paid to agent</dt><dd>${fmtDate(d.commission.paidAt)}</dd>${ageing ? `<dt>Ageing</dt><dd>${ageing > 30 * DAY ? badge(fmtDur(ageing) + ' – overdue from developer', 'slds-theme_error') : fmtDur(ageing)}</dd>` : ''}</dl>
      ${s < 4 && !d.lost ? `<button class="slds-button slds-button_brand slds-m-top_small" data-act="commNext" ${s === 0 && !canClaim ? 'disabled' : ''}>Move to “${COMMISSION_FLOW[s + 1]}”</button>${s === 0 && !canClaim ? `<p class="bp-small bp-muted slds-m-top_x-small">Can be claimed once the deal reaches “${esc(stagesOf(d.type)[trig].name)}”.</p>` : ''}` : ''}`, '', 'budget')}
    ${card('Attribution', `<p class="bp-small">${d.campaignId ? `Campaign <a class="bp-link" data-act="open" data-view="campaign" data-id="${d.campaignId}">${esc(campaignById(d.campaignId).name)}</a> via ${esc(d.channel)}. When this commission is received it counts toward the campaign's ROI.` : 'No campaign – organic source: ' + esc(d.channel)}</p>`, '', 'campaign')}</div></div>`;
}

/* ---------- views: campaigns ---------- */
function campaignStats(c) {
  const leads = S.leads.filter(l => l.attributions.some(a => a.campaignId === c.id));
  const orig = S.leads.filter(l => l.campaignId === c.id);
  const qualified = orig.filter(l => ['Qualified', 'Converted'].includes(l.status));
  const deals = S.deals.filter(d => d.campaignId === c.id && !d.lost);
  const received = deals.filter(d => d.commission.status >= 3).reduce((a, d) => a + commissionCalc(d).gross, 0);
  const spend = Object.values(c.spend).reduce((a, b) => a + b, 0);
  const viewings = orig.filter(l => ['Contacted', 'Qualified', 'Converted'].includes(l.status)).length;
  return {leads:orig.length, touches:leads.length, qualified:qualified.length, deals:deals.length, received, spend, viewings,
    cpl:orig.length ? spend / orig.length : 0, cpq:qualified.length ? spend / qualified.length : 0, cpd:deals.length ? spend / deals.length : 0, roi:spend ? received / spend : 0};
}
const permitState = c => !c.permit ? {label:'No permit', theme:'slds-theme_error', ok:false} : c.permit.expiry < S.now ? {label:'Permit expired', theme:'slds-theme_error', ok:false} : c.permit.expiry - S.now < 7 * DAY ? {label:'Expires in ' + fmtDur(c.permit.expiry - S.now), theme:'slds-theme_warning', ok:true} : {label:'Valid to ' + fmtDate(c.permit.expiry), theme:'slds-theme_success', ok:true};
function viewCampaigns() {
  if (!S.cfg.features.optionB) return card('Campaigns', '<div class="bp-empty">Campaign management is part of Option B (Marketing + Lead Operations). Turn it on in Setup → Packages.</div>');
  const alerts = S.campaigns.filter(c => c.status === 'Active' && (!permitState(c).ok || c.permit.expiry - S.now < 7 * DAY));
  return pageHeader('campaign', 'Campaigns', 'Marketing campaigns', `<button class="slds-button slds-button_neutral" data-act="newCampaign">${bIcon('add')}New campaign</button>`)
    + alerts.map(c => `<div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_x-small"><h2>Ad permit alert: “${esc(c.name)}” – ${esc(permitState(c).label)}. Renew it or the campaign will be paused automatically.</h2></div>`).join('')
    + `<div class="slds-card bp-table-wrap"><table class="slds-table slds-table_cell-buffer slds-table_bordered bp-small"><thead><tr><th>Campaign</th><th>Status</th><th>Ad permit</th><th>Line</th><th>Spend</th><th>Leads</th><th>Cost / lead</th><th>Qualified</th><th>Deals</th><th>Commission received</th><th>ROI</th></tr></thead><tbody>${S.campaigns.map(c => {
      const s = campaignStats(c), p = permitState(c);
      return `<tr><td><a class="bp-link" data-act="open" data-view="campaign" data-id="${c.id}">${esc(c.name)}</a></td><td>${badge(c.status, c.status === 'Active' ? 'slds-theme_success' : '')}</td><td>${badge(p.label, p.theme)}</td><td>${esc(c.lob)}</td><td>${fmtAED(s.spend)}</td><td>${s.leads}</td><td>${s.leads ? fmtAED(s.cpl) : '—'}</td><td>${s.qualified}</td><td>${s.deals}</td><td>${fmtAED(s.received)}</td><td>${s.spend ? '<b>' + s.roi.toFixed(1) + '×</b>' : '—'}</td></tr>`;
    }).join('')}</tbody></table></div>`;
}
function viewCampaign() {
  const c = campaignById(S.recId);
  if (!c) return '<div class="bp-empty">Campaign not found.</div>';
  const s = campaignStats(c), p = permitState(c);
  const chRows = c.channels.map(ch => {
    const leads = S.leads.filter(l => l.campaignId === c.id && l.channel === ch);
    const q = leads.filter(l => ['Qualified', 'Converted'].includes(l.status)).length;
    const deals = S.deals.filter(d => d.campaignId === c.id && d.channel === ch);
    const rec = deals.filter(d => d.commission.status >= 3).reduce((a, d) => a + commissionCalc(d).gross, 0);
    const sp = c.spend[ch] || 0;
    return {ch, leads:leads.length, q, deals:deals.length, rec, sp};
  });
  const maxL = Math.max(1, ...chRows.map(r => r.leads));
  const crRows = c.creatives.map(cr => ({cr, leads:S.leads.filter(l => l.campaignId === c.id && l.creative === cr).length, deals:S.deals.filter(d => d.campaignId === c.id && leadById(d.leadId) && leadById(d.leadId).creative === cr).length}));
  return pageHeader('campaign', 'Campaign · ' + c.id, esc(c.name) + ' ' + badge(c.status, c.status === 'Active' ? 'slds-theme_success' : ''),
      c.status === 'Active' ? `<button class="slds-button slds-button_neutral" data-act="pauseCampaign">${bIcon('pause')}Pause</button>` : `<button class="slds-button slds-button_brand" data-act="activateCampaign">${bIcon('play')}Activate</button>`,
      detailsRow([['Objective', esc(c.lob) + ' · ' + esc(c.project)], ['Emirate', esc(c.emirate)], ['Budget', fmtAED(c.budget)], ['Spend', fmtAED(s.spend) + ` (${c.budget ? Math.round(s.spend / c.budget * 100) : 0}%)`], ['Targets', `${c.targetLeads} leads · ${c.targetDeals} deals`], ['Ad permit', badge(p.label, p.theme)]]))
    + `<div class="bp-tiles slds-m-bottom_small">
      <div class="bp-tile"><div class="bp-tile-label">Leads</div><div class="bp-tile-value">${s.leads}</div><div class="bp-tile-sub">of ${c.targetLeads || '—'} target${s.touches - s.leads > 0 ? ' · +' + (s.touches - s.leads) + ' repeat enquiries' : ''}</div></div>
      <div class="bp-tile"><div class="bp-tile-label">Cost per lead</div><div class="bp-tile-value">${s.leads ? fmtAED(s.cpl) : '—'}</div></div>
      <div class="bp-tile"><div class="bp-tile-label">Cost per qualified lead</div><div class="bp-tile-value">${s.qualified ? fmtAED(s.cpq) : '—'}</div><div class="bp-tile-sub">${s.qualified} qualified</div></div>
      <div class="bp-tile"><div class="bp-tile-label">Cost per deal</div><div class="bp-tile-value">${s.deals ? fmtAED(s.cpd) : '—'}</div><div class="bp-tile-sub">${s.deals} deals</div></div>
      <div class="bp-tile bp-good"><div class="bp-tile-label">Commission received</div><div class="bp-tile-value">${fmtAED(s.received)}</div></div>
      <div class="bp-tile ${s.roi >= 1 ? 'bp-good' : 'bp-warn'}"><div class="bp-tile-label">ROI (commission ÷ spend)</div><div class="bp-tile-value">${s.spend ? s.roi.toFixed(1) + '×' : '—'}</div></div>
    </div>
    <div class="bp-grid bp-cols-2"><div>
      ${card('Performance by channel', `<table class="slds-table slds-table_cell-buffer slds-table_bordered bp-small"><thead><tr><th>Channel</th><th>Spend</th><th>Leads</th><th></th><th>Cost/lead</th><th>Qualified</th><th>Deals</th><th>Commission</th><th></th></tr></thead><tbody>${chRows.map(r => `<tr><td>${esc(r.ch)}${c.paused.includes(r.ch) ? ' ' + badge('Paused') : ''}</td><td>${fmtAED(r.sp)}</td><td>${r.leads}</td><td style="width:120px"><div class="bp-bar-track"><div class="bp-bar" style="width:${r.leads / maxL * 100}%"></div></div></td><td>${r.leads ? fmtAED(r.sp / r.leads) : '—'}</td><td>${r.q}</td><td>${r.deals}</td><td>${fmtAED(r.rec)}</td><td><button class="slds-button slds-button_neutral slds-button_small" data-act="toggleChannel" data-ch="${esc(r.ch)}">${c.paused.includes(r.ch) ? 'Resume' : 'Pause'}</button></td></tr>`).join('')}</tbody></table>`, '', 'metrics')}
      ${card('Performance by creative', `<table class="slds-table slds-table_cell-buffer slds-table_bordered bp-small"><thead><tr><th>Creative</th><th>Leads</th><th>Deals</th></tr></thead><tbody>${crRows.map(r => `<tr><td>${esc(r.cr)}</td><td>${r.leads}</td><td>${r.deals}</td></tr>`).join('')}</tbody></table>`, '', 'feed')}
    </div><div>
      ${card('Compliance – ad permit', c.permit ? `<dl class="bp-kv"><dt>Permit no.</dt><dd>Trakheesi ${esc(c.permit.no)}</dd><dt>Expiry</dt><dd>${fmtDate(c.permit.expiry)} ${badge(p.label, p.theme)}</dd><dt>Emirate</dt><dd>${esc(c.emirate)} rule pack</dd></dl><button class="slds-button slds-button_neutral slds-m-top_small" data-act="addPermit">Renew / replace permit</button>` : `<div class="slds-notify slds-notify_alert slds-alert_error"><h2>No ad permit – this campaign can’t go live.</h2></div><button class="slds-button slds-button_brand slds-m-top_small" data-act="addPermit">${bIcon('add')}Add permit</button>`, '', 'disclosure_and_compliance')}
      ${card('Funnel', [['Leads', s.leads], ['Contacted+', s.viewings], ['Qualified', s.qualified], ['Deals', s.deals]].map(([k, v], i) => `<div class="bp-bar-row" style="grid-template-columns:90px 1fr 40px"><span>${k}</span><div class="bp-bar-track"><div class="bp-bar ${i === 3 ? 'bp-alt' : ''}" style="width:${s.leads ? v / s.leads * 100 : 0}%"></div></div><b>${v}</b></div>`).join(''), '', 'chart')}
    </div></div>`;
}

/* ---------- views: dashboard ---------- */
function viewDashboard() {
  const leads = S.leads.filter(l => S.now - l.createdAt <= 30 * DAY);
  const resp = leads.filter(l => l.firstResponseAt && l.assignedAt).map(l => l.firstResponseAt - l.assignedAt).sort((a, b) => a - b);
  const median = resp.length ? resp[Math.floor(resp.length / 2)] : 0;
  const breaches = leads.filter(l => l.breached).length;
  const untouched = S.leads.filter(l => OPEN.includes(l.status) && S.now - (l.lastActivityAt || l.createdAt) > 48 * HOUR);
  const conv = leads.filter(l => l.status === 'Converted').length;
  const chans = CHANNELS.map(ch => {
    const ls = leads.filter(l => l.channel === ch);
    const ds = S.deals.filter(d => d.channel === ch && !d.lost);
    return {ch, leads:ls.length, q:ls.filter(l => ['Qualified', 'Converted'].includes(l.status)).length, deals:ds.length, rec:ds.filter(d => d.commission.status >= 3).reduce((a, d) => a + commissionCalc(d).gross, 0)};
  }).filter(r => r.leads || r.deals).sort((a, b) => b.leads - a.leads);
  const maxL = Math.max(1, ...chans.map(r => r.leads));
  const lost = LOST_REASONS.map(r => ({r, n:S.leads.filter(l => l.status === 'Lost' && l.lostReason === r).length})).sort((a, b) => b.n - a.n);
  const maxLost = Math.max(1, ...lost.map(x => x.n));
  const board = agents().map(a => {
    const ls = leads.filter(l => l.ownerId === a.id);
    const rs = ls.filter(l => l.firstResponseAt).map(l => l.firstResponseAt - l.assignedAt);
    const ds = S.deals.filter(d => d.ownerId === a.id && !d.lost);
    return {a, open:openLoad(a.id), avg:rs.length ? rs.reduce((x, y) => x + y, 0) / rs.length : 0, breaches:ls.filter(l => l.breached).length, deals:ds.length, rec:ds.filter(d => d.commission.status >= 3).reduce((x, d) => x + commissionCalc(d).agent, 0)};
  }).sort((x, y) => y.deals - x.deals || x.avg - y.avg);
  const stuckDeals = S.deals.filter(d => !d.lost && stageOf(d).slaDays && S.now - d.stageEnteredAt > stageOf(d).slaDays * DAY);
  const overdueComm = S.deals.filter(d => d.commission.status > 0 && d.commission.status < 3 && d.commission.claimedAt && S.now - d.commission.claimedAt > 30 * DAY);
  return pageHeader('dashboard', 'Dashboard · last 30 days', 'Sales &amp; marketing performance', '', detailsRow([['Viewing as', esc(me().name) + ' · ' + esc(me().role)], ['Data', 'Live from this demo – capture or convert leads and watch it change']]))
    + `<div class="bp-tiles slds-m-bottom_small">
      <div class="bp-tile ${median <= S.cfg.sla.firstResponseMin * MIN ? 'bp-good' : 'bp-warn'}"><div class="bp-tile-label">Speed to lead (median)</div><div class="bp-tile-value">${fmtDur(median)}</div><div class="bp-tile-sub">SLA ${S.cfg.sla.firstResponseMin} min</div></div>
      <div class="bp-tile ${breaches ? 'bp-bad' : 'bp-good'}"><div class="bp-tile-label">SLA breaches</div><div class="bp-tile-value">${breaches}</div><div class="bp-tile-sub">${leads.length ? Math.round(breaches / leads.length * 100) : 0}% of ${leads.length} leads</div></div>
      <div class="bp-tile ${untouched.length ? 'bp-bad' : 'bp-good'}"><div class="bp-tile-label">Open leads untouched &gt; 48h</div><div class="bp-tile-value">${untouched.length}</div></div>
      <div class="bp-tile"><div class="bp-tile-label">Lead → deal conversion</div><div class="bp-tile-value">${leads.length ? (conv / leads.length * 100).toFixed(1) : 0}%</div></div>
      <div class="bp-tile ${stuckDeals.length ? 'bp-warn' : 'bp-good'}"><div class="bp-tile-label">Deals stuck past stage limit</div><div class="bp-tile-value">${stuckDeals.length}</div></div>
      <div class="bp-tile ${overdueComm.length ? 'bp-bad' : 'bp-good'}"><div class="bp-tile-label">Commission overdue &gt; 30d</div><div class="bp-tile-value">${overdueComm.length}</div><div class="bp-tile-sub">${fmtAED(overdueComm.reduce((a, d) => a + commissionCalc(d).gross, 0))}</div></div>
    </div>
    <div class="bp-grid bp-cols-2"><div>
      ${card('Funnel by channel (leads → qualified → deals → commission received)', `${chans.map(r => `<div class="bp-bar-row"><span>${esc(r.ch)}</span><div><div class="bp-bar-track"><div class="bp-bar" style="width:${r.leads / maxL * 100}%"></div></div><div class="bp-bar-track" style="margin-top:2px;height:6px"><div class="bp-bar bp-alt" style="height:6px;width:${r.q / maxL * 100}%"></div></div><div class="bp-bar-track" style="margin-top:2px;height:6px"><div class="bp-bar bp-alt2" style="height:6px;width:${r.deals / maxL * 100}%"></div></div></div><span class="bp-muted">${r.leads} · ${r.q} · ${r.deals}<br>${fmtK(r.rec)}</span></div>`).join('')}<div class="bp-small bp-muted slds-m-top_x-small"><span style="color:#0176d3">■</span> leads <span style="color:#06a59a">■</span> qualified <span style="color:#9050e9">■</span> deals · right column: commission received (AED)</div>`, '', 'metrics')}
      ${card('Agent leaderboard', `<table class="slds-table slds-table_cell-buffer slds-table_bordered bp-small"><thead><tr><th>Agent</th><th>BRN</th><th>Open leads</th><th>Avg response</th><th>Breaches</th><th>Deals</th><th>Agent commission received</th></tr></thead><tbody>${board.map(b => `<tr><td>${esc(b.a.name)}</td><td>${b.a.brnExpiry > S.now ? badge('Valid', 'slds-theme_success') : badge('Expired', 'slds-theme_error')}</td><td>${b.open}</td><td>${b.avg ? fmtDur(b.avg) : '—'}</td><td>${b.breaches}</td><td>${b.deals}</td><td>${fmtAED(b.rec)}</td></tr>`).join('')}</tbody></table>`, '', 'people')}
    </div><div>
      ${card('Lost reasons', lost.map(x => `<div class="bp-bar-row" style="grid-template-columns:170px 1fr 30px"><span>${esc(x.r)}</span><div class="bp-bar-track"><div class="bp-bar" style="background:#ba0517;width:${x.n / maxLost * 100}%"></div></div><b>${x.n}</b></div>`).join(''), '', 'report')}
      ${card('Ageing leads – no activity for 48h+', untouched.length ? `<table class="slds-table slds-table_bordered bp-small"><tbody>${untouched.sort((a, b) => (a.lastActivityAt || a.createdAt) - (b.lastActivityAt || b.createdAt)).slice(0, 8).map(l => `<tr><td><a class="bp-link" data-act="open" data-view="lead" data-id="${l.id}">${esc(l.name)}</a></td><td>${esc(userName(l.ownerId))}</td><td>${statusBadge(l.status)}</td><td class="bp-fail">${fmtDur(S.now - (l.lastActivityAt || l.createdAt))}</td></tr>`).join('')}</tbody></table>` : '<div class="bp-empty">None.</div>', '', 'timesheet')}
      ${card('Unassigned queue', (() => { const q = S.leads.filter(l => !l.ownerId && OPEN.includes(l.status)); return q.length ? q.map(l => `<div class="bp-small slds-p-vertical_xx-small"><a class="bp-link" data-act="open" data-view="lead" data-id="${l.id}">${esc(l.name)}</a> · ${esc(l.lob)} · waiting ${fmtDur(S.now - l.createdAt)}</div>`).join('') : '<div class="bp-empty">Empty.</div>'; })(), '', 'queue')}
    </div></div>`;
}

function setPersona(id) { S.persona = id; }
function rearmRohit() {
  const l = leadById(S.story.rohit);
  if (!l || ['Converted', 'Lost'].includes(l.status)) return;
  l.status = 'New'; l.ownerId = 'u_sara'; l.assignedAt = S.now - 9 * MIN; l.slaDueAt = S.now + 6 * MIN; l.firstResponseAt = null; l.escalated = false;
  activity(l, 'system', 'Workshop: SLA timer re-armed (9 minutes since assignment, 6 minutes left).', 'Demo');
}
function jumpTo(v) {
  const d = new Date(S.now);
  let base = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  if (v === 'next') { S.now = base + DAY + 9 * HOUR + 5 * MIN; return; }
  const [h, m] = v.split(':').map(Number);
  S.now = base + h * HOUR + m * MIN;
}

function refreshLive() {
  const c = $('#clock'); if (c) c.textContent = fmtTime(S.now);
  document.querySelectorAll('[data-sla]').forEach(el => {
    const l = leadById(el.getAttribute('data-sla')); if (!l) return;
    const tmp = document.createElement('span'); tmp.innerHTML = slaBadge(l);
    const n = tmp.firstElementChild; if (n) { el.className = n.className; el.textContent = n.textContent; }

/* ---------- actions ---------- */
function doCall(l) {
  if (!l) return;
  const blocks = callBlocks(l);
  if (blocks.length) {
    activity(l, 'block', 'Call blocked by telemarketing guard: ' + blocks.join(' '), me().name);
    render();
    openModal('Call blocked', `<div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small"><h2>The telemarketing guard stopped this call.</h2></div><ul class="slds-list_dotted">${blocks.map(b => `<li>${esc(b)}</li>`).join('')}</ul><p class="bp-small bp-muted slds-m-top_small">UAE Cabinet Resolution 56/2024. The attempt is logged on the lead. Messaging is still possible where consent is recorded.</p>`);
    return;
  }
  openModal('Call ' + esc(l.name), `<p class="slds-m-bottom_small">Calling ${esc(l.phone)} from the firm's registered number…</p>
    <div id="modal-errors"></div>
    ${fSelect('call-outcome', 'Outcome', [['', '— select —'], ['connected', 'Connected'], ['noanswer', 'No answer'], ['refused', 'Refused – do not call again today']], '', true)}
    <div class="slds-form-element"><label class="slds-form-element__label" for="call-notes">Notes</label><div class="slds-form-element__control"><textarea class="slds-textarea" id="call-notes"></textarea></div></div>`,
    `<button class="slds-button slds-button_neutral" data-act="closeModal">Cancel</button><button class="slds-button slds-button_brand" data-act="logCall">Log call</button>`);
}

  togglePlay:() => { S.playing = !S.playing; render(); },
  speed:el => { S.speed = Number(el.value); },
  jump:el => { if (!el.value) return; jumpTo(el.value); slaEngine(); render(); toast('info', 'Demo clock moved', 'Now ' + fmtTime(S.now) + ' GST, ' + fmtDate(S.now)); },
  reset:() => { buildState(); closeModal(); render(); toast('success', 'Demo reset', 'All data restored to the starting point.'); },
  toggleNotif:() => { S.notifOpen = !S.notifOpen; render(); },

  newLead:() => {

      <div class="slds-col slds-size_1-of-2">${fInput('nl-name', 'Full name', '', 'text', true)}</div>
      <div class="slds-col slds-size_1-of-2">${fInput('nl-phone', 'Mobile', '', 'tel', true, 'placeholder="+971 50 000 0000"')}</div>
      <div class="slds-col slds-size_1-of-2">${fInput('nl-email', 'Email', '', 'email')}</div>
      <div class="slds-col slds-size_1-of-2">${fSelect('nl-lang', 'Preferred language', LANGS, 'English', true)}</div>
      <div class="slds-col slds-size_1-of-2">${fSelect('nl-lob', 'Line of business', ['', ...LOBS], '', true)}</div>
      <div class="slds-col slds-size_1-of-2">${fSelect('nl-channel', 'Source (declared)', ['', ...CHANNELS], 'Walk-in', true)}</div>
      <div class="slds-col slds-size_1-of-2">${fSelect('nl-project', 'Project / listing', ['', ...PROJECTS.map(p => p.name)], '')}</div>
      <div class="slds-col slds-size_1-of-2">${fInput('nl-budget', 'Budget (AED)', '', 'number', false, 'min="0"')}</div>
      <div class="slds-col slds-size_1-of-1">${fSelect('nl-campaign', 'Campaign', [['', '— none —'], ...S.campaigns.map(c => [c.id, c.name])], '')}</div>

  },
  saveLead:() => {
    const budget = val('nl-budget');
    if (budget && Number(budget) < 0) return modalError(['Budget can’t be negative.']);
    const res = captureLead({name:val('nl-name'), phone:val('nl-phone'), email:val('nl-email'), lang:val('nl-lang'), lob:val('nl-lob'), channel:val('nl-channel'),
      project:val('nl-project'), budget, campaignId:val('nl-campaign') || null, consent:$('#nl-consent').checked});
    if (!res.ok) return modalError(res.errors);
    closeModal();
    toast(res.merged ? 'info' : 'success', res.merged ? 'Matched an existing lead' : 'Lead created', res.merged ? 'Merged as a repeat enquiry – no duplicate.' : `Routed to ${esc(userName(res.lead.ownerId))}`);
    go('lead', res.lead.id);
  },
  importCsv:() => {
    const sample = 'name,phone,email,language,line_of_business,budget\nNadia Rahim,+971501112233,nadia@example.com,Arabic,Off-plan,1800000\nTom Hughes,0507778899,,English,Secondary,1200000\nNo Phone Person,,x@example.com,English,Off-plan,900000\nAhmed Mansoori,+971502345678,,Arabic,Secondary,1900000';
    openModal('Import leads from CSV', `<div id="modal-errors"></div>${fSelect('csv-channel', 'Source of these leads (required)', ['', ...CHANNELS], '', true)}
      ${fSelect('csv-campaign', 'Campaign', [['', '— none —'], ...S.campaigns.map(c => [c.id, c.name])], '')}
      <div class="slds-form-element slds-m-bottom_x-small"><label class="slds-form-element__label" for="csv-text">Paste CSV, or choose a file</label><div class="slds-form-element__control"><textarea class="slds-textarea" id="csv-text" style="min-height:140px;font-family:monospace;font-size:12px">${esc(sample)}</textarea></div></div>
      <input type="file" accept=".csv,text/csv" id="csv-file" class="slds-m-bottom_small" data-act="csvFile">
      <div id="csv-result"></div>`, `<button class="slds-button slds-button_neutral" data-act="closeModal">Close</button><button class="slds-button slds-button_brand" data-act="runImport">Import</button>`, 'medium');
  },
  runImport:() => {
    const channel = val('csv-channel');
    if (!channel) return modalError(['Declare the source of these leads before importing.']);
    const lines = val('csv-text').trim().split(/\r?\n/).filter(x => x.trim());
    if (lines.length < 2) return modalError(['The CSV needs a header row and at least one data row.']);
    const head = lines[0].split(',').map(h => h.trim().toLowerCase());
    const need = ['name', 'phone', 'line_of_business'];
    const missingCols = need.filter(n => !head.includes(n));
    if (missingCols.length) return modalError(['Missing columns: ' + missingCols.join(', ')]);
    modalError([]);
    const out = [];
    lines.slice(1).forEach((line, i) => {
      const cells = line.split(','); const row = {}; head.forEach((h, j) => row[h] = (cells[j] || '').trim());
      const res = captureLead({name:row.name, phone:row.phone, email:row.email, lang:LANGS.includes(row.language) ? row.language : 'English', lob:row.line_of_business, channel, budget:row.budget, campaignId:val('csv-campaign') || null});
      out.push({n:i + 2, name:row.name || '(blank)', res});

    const k = el.dataset.key, v = Number(el.value), next = {...S.cfg.splits, [k]:v};
    if (!(v >= 0 && v <= 100)) { toast('error', 'Split must be between 0 and 100%', ''); render(); return; }
    if (next.agent + next.teamLeader + next.referral > 100) { toast('error', 'Splits exceed 100%', 'Not saved.'); render(); return; }
    S.cfg.splits = next; render();
  },
  agentActive:el => { S.users[el.dataset.id].active = el.checked; render(); },
  renewBrn:el => { const u = S.users[el.dataset.id]; u.brnExpiry = Date.UTC(new Date(S.now).getUTCFullYear() + 1, new Date(S.now).getUTCMonth(), new Date(S.now).getUTCDate()); render(); toast('success', 'BRN renewal recorded', `${esc(u.name)} is eligible for routing again (valid to ${fmtDate(u.brnExpiry)}).`); },
};

/* ---------- event wiring ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) { if (S.notifOpen && !ev.target.closest('.bp-notif-pop')) { S.notifOpen = false; render(); } return; }
  if (['SELECT', 'INPUT', 'TEXTAREA'].includes(el.tagName)) return;
  const fn = ACT[el.dataset.act];
  if (fn) { ev.preventDefault(); try { fn(el, ev); } catch (e) { console.error(e); toast('error', 'Something went wrong', esc(e.message)); } }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.bind) {
    const l = leadById(S.recId); if (!l) return;
    if (el.dataset.bind === 'budget') { const v = Number(el.value); if (el.value && !(v > 0)) { toast('error', 'Budget must be a positive number', ''); el.value = l.budget || ''; return; } l.budget = v || 0; }
    else l.qual[el.dataset.key] = el.value;
    return;
  }
  if (el.dataset && el.dataset.act && ACT[el.dataset.act] && ['SELECT', 'INPUT', 'TEXTAREA'].includes(el.tagName)) {
    try { ACT[el.dataset.act](el, ev); } catch (e) { console.error(e); toast('error', 'Something went wrong', esc(e.message)); }
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); });
$('#file-picker').addEventListener('change', ev => {
  const f = ev.target.files && ev.target.files[0], d = dealById(S.recId), doc = S.pendingDoc;
  if (!f || !d || !doc) return;
  if (f.size > 25e6) { toast('error', 'File too large', 'The limit is 25 MB.'); return; }
  d.docs[doc] = {file:f.name, at:S.now, by:me().name};
  activity(d, 'doc', `${doc} uploaded (${f.name})`, me().name);
  S.pendingDoc = null; render(); toast('success', 'Document uploaded', esc(doc));
});
document.addEventListener('dragstart', ev => { const c = ev.target.closest && ev.target.closest('[data-drag]'); if (c) { ev.dataTransfer.setData('text/plain', c.dataset.drag); ev.dataTransfer.effectAllowed = 'move'; } });
document.addEventListener('dragover', ev => { const col = ev.target.closest && ev.target.closest('[data-drop]'); if (col) { ev.preventDefault(); document.querySelectorAll('.bp-drop').forEach(x => x !== col && x.classList.remove('bp-drop')); col.classList.add('bp-drop'); } });
document.addEventListener('dragleave', ev => { const col = ev.target.closest && ev.target.closest('[data-drop]'); if (col && !col.contains(ev.relatedTarget)) col.classList.remove('bp-drop'); });
document.addEventListener('drop', ev => {
  const col = ev.target.closest && ev.target.closest('[data-drop]'); if (!col) return;
  ev.preventDefault();
  const d = dealById(ev.dataTransfer.getData('text/plain')); if (!d) return;
  const to = Number(col.dataset.drop);
  if (to !== d.stageIdx) advanceDeal(d, to);
  S.highlight = null; render();
});

/* ---------- clock ---------- */
setInterval(() => {
  if (!S.playing) return;
  S.now += S.speed * 1000;
  const changed = slaEngine();
  if (changed && !$('#modal-root').innerHTML) render(); else refreshLive();
}, 1000);

buildState();
render();
</script>
</body>
</html>
